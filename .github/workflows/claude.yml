name: Claude Code

on:
  # Automatic review when a PR is opened or updated
  pull_request:
    types: [opened, synchronize]
    branches: [main]

  # Interactive: respond to @claude mentions in PR/issue comments
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ── Automated PR review ──────────────────────────────────────────────────────
  pr-review:
    name: Automated PR Review
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Claude can see the full diff

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-opus-4-6 --max-turns 5"
          prompt: |
            You are reviewing a pull request for the LiveMux project (OBS-compatible
            RTMP/HLS streaming server). Follow the guidelines in CLAUDE.md.

            Review the diff for:
            1. Security vulnerabilities (injection, auth bypass, path traversal, XSS, etc.)
            2. Correctness bugs and edge cases
            3. Adherence to project conventions (see CLAUDE.md)
            4. Test coverage for new code
            5. Performance concerns

            Be concise and actionable. Post inline comments on specific lines where
            possible. If everything looks good, say so briefly.

  # ── Interactive @claude mentions ────────────────────────────────────────────
  interactive:
    name: Claude Interactive
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-opus-4-6 --max-turns 10"
