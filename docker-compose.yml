version: "3.9"

services:
  # ── RTMP / HLS ingest ─────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: streaming-nginx
    ports:
      - "${NGINX_RTMP_PORT:-1935}:1935"   # RTMP ingest (OBS)
      - "${NGINX_HTTP_PORT:-80}:80"        # HLS + Web dashboard
    volumes:
      - hls_data:/hls
      - recordings:/recordings
    depends_on:
      - api
    restart: unless-stopped
    environment:
      - HLS_FRAGMENT_SECONDS=${HLS_FRAGMENT_SECONDS:-2}
      - HLS_PLAYLIST_LENGTH=${HLS_PLAYLIST_LENGTH:-10}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-${ADMIN_API_KEY}}
    networks:
      - streaming

  # ── Management API ────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: streaming-api
    expose:
      - "3000"
    volumes:
      - db_data:/app/data
      - recordings:/recordings
    environment:
      - NODE_ENV=production
      - API_PORT=${API_PORT:-3000}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-change_me_in_production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - streaming

  # ── Redis (active stream state / scaling) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: streaming-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - streaming

volumes:
  hls_data:
  recordings:
  db_data:
  redis_data:

networks:
  streaming:
    driver: bridge
