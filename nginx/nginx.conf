load_module modules/ngx_rtmp_module.so;

worker_processes auto;
worker_rlimit_nofile 65536;
rtmp_auto_push on;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# ── RTMP ──────────────────────────────────────────────────────────────────────
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_connections 100;

        application live {
            live on;
            meta copy;

            # ── Stream key authentication ──────────────────────────────────
            # nginx posts stream name + client IP to the API; non-2xx = reject
            on_publish      http://api:3000/api/auth/publish;
            on_publish_done http://api:3000/api/auth/publish-done;

            # ── HLS output ────────────────────────────────────────────────
            hls on;
            hls_path /hls;
            hls_fragment    2s;
            hls_playlist_length 10s;
            hls_sync        100ms;
            hls_cleanup     on;

            # Keep original stream for viewers who pull via RTMP
            deny play all;

            # ── Recording ────────────────────────────────────────────────
            record all;
            record_path /recordings;
            record_unique on;
            record_suffix  -%Y%m%d-%H%M%S.flv;

            # After recording ends: convert FLV→MP4, then notify API.
            # $path = full path to .flv file, $name = stream key
            exec_record_done /usr/local/bin/convert.sh $path $name;
        }
    }
}

# ── HTTP ──────────────────────────────────────────────────────────────────────
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain application/json application/javascript text/css;

    # ── Logging ───────────────────────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # ── Health check ──────────────────────────────────────────────────
        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── HLS segments ─────────────────────────────────────────────────
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }
            root /;
            expires -1;
            add_header Cache-Control   no-cache;
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
        }

        # ── RTMP stats (XML) – internal only ─────────────────────────────
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            allow 127.0.0.1;
            allow 172.0.0.0/8;   # Docker internal networks
            deny  all;
        }

        location /stat.xsl {
            root /usr/share/nginx/html;
        }

        # ── RTMP control (drop stream, etc.) ─────────────────────────────
        location /control {
            rtmp_control all;
            allow 172.0.0.0/8;   # Docker internal only
            deny  all;
        }

        # ── Management API (proxy to Node.js) ────────────────────────────
        location /api {
            proxy_pass         http://api:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # ── Web admin dashboard (static files) ───────────────────────────
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
