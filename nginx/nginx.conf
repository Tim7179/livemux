load_module modules/ngx_rtmp_module.so;

worker_processes auto;
worker_rlimit_nofile 65536;
rtmp_auto_push on;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# ── RTMP ──────────────────────────────────────────────────────────────────────
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_connections 100;

        application live {
            live on;
            meta copy;

            # ── Stream key authentication ──────────────────────────────────
            # nginx posts stream name + client IP to the API; non-2xx = reject
            on_publish      http://api:3000/api/auth/publish;
            on_publish_done http://api:3000/api/auth/publish-done;

            # ── HLS output ────────────────────────────────────────────────
            hls on;
            hls_path /hls;
            hls_fragment    2s;
            hls_playlist_length 10s;
            hls_sync        100ms;
            hls_cleanup     on;

            # Keep original stream for viewers who pull via RTMP
            deny play all;

            # Drop idle publishers so stale sessions are cleaned up
            drop_idle_publisher 10s;

            # ── Recording ────────────────────────────────────────────────
            record all;
            record_path /recordings;
            record_unique on;
            record_suffix  -%Y%m%d-%H%M%S.flv;

            # After recording ends: convert FLV→MP4, then notify API.
            # $path = full path to .flv file, $name = stream key
            exec_record_done /usr/local/bin/convert.sh $path $name;
        }
    }
}

# ── HTTP ──────────────────────────────────────────────────────────────────────
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain application/json application/javascript text/css;

    # ── Logging ───────────────────────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow Docker healthcheck over plain HTTP
        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # ── Security headers ──────────────────────────────────────────────
        add_header X-Frame-Options          "DENY"                           always;
        add_header X-Content-Type-Options   "nosniff"                        always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        # CSP: allow scripts/styles/fonts from self and CDN (Bootstrap + hls.js)
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self';" always;

        # ── Health check ──────────────────────────────────────────────────
        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── HLS segments ─────────────────────────────────────────────────
        location /hls {
            # ── Internal network only ─────────────────────────────────────
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }
            root /;
            expires -1;
            add_header Cache-Control   no-cache;
            add_header Access-Control-Allow-Origin  $http_origin;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
        }

        # ── RTMP stats (XML) – internal only ─────────────────────────────
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            allow 127.0.0.1;
            allow 172.0.0.0/8;   # Docker internal networks
            deny  all;
        }

        location /stat.xsl {
            root /usr/share/nginx/html;
        }

        # ── RTMP control (drop stream, etc.) ─────────────────────────────
        location /control {
            rtmp_control all;
            allow 172.0.0.0/8;   # Docker internal only
            deny  all;
        }

        # ── Management API (proxy to Node.js) ────────────────────────────
        location /api {
            proxy_pass         http://api:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Web admin dashboard (static files) – internal only ───────────
        location / {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;

            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
